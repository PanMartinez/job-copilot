<svg xmlns="http://www.w3.org/2000/svg" width="860" height="130" viewBox="0 0 860 130">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color" values="#ff0000;#ff9900;#ffff00;#00ff00;#00ccff;#cc00ff;#ff0000" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00ff00">
        <animate attributeName="stop-color" values="#00ff00;#00ccff;#cc00ff;#ff0000;#ff9900;#ffff00;#00ff00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#cc00ff">
        <animate attributeName="stop-color" values="#cc00ff;#ff0000;#ff9900;#ffff00;#00ff00;#00ccff;#cc00ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <g id="sparkle">
      <path d="M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2 Z" fill="#ffffff"/>
    </g>
  </defs>

  <rect width="860" height="130" fill="#000000"/>

  <text x="430" y="62" text-anchor="middle"
        font-family="Impact,'Arial Black',sans-serif" font-size="52"
        fill="url(#rainbow)" stroke="#ffffff" stroke-width="1.5">
    ★ JOB SEARCH COPILOT ★
  </text>
  <text x="430" y="100" text-anchor="middle"
        font-family="'Comic Sans MS','Comic Sans',cursive" font-size="20" fill="#00ffff">
    ~*~ yOuR aI sIdEkIcK fOr ThE jOb HuNt ~*~
    <animate attributeName="opacity" values="1;1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <use href="#sparkle" x="90" y="35">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="770" y="30">
    <animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="200" y="105">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="660" y="100">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="430" y="18">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
  </use>
</svg>

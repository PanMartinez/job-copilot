<svg xmlns="http://www.w3.org/2000/svg" width="400" height="31" viewBox="0 0 400 31">
  <!-- four classic 88x31 buttons in one strip -->
  <g font-family="Verdana,Arial,sans-serif">
    <!-- 1: MADE WITH ROBOTS -->
    <rect x="0" width="88" height="31" fill="#000080" stroke="#c0c0c0" stroke-width="2"/>
    <text x="44" y="14" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">MADE WITH</text>
    <text x="44" y="26" text-anchor="middle" font-size="11" fill="#00ff00" font-weight="bold">
      🤖 ROBOTS 🤖
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>
    <!-- 2: FREE FOR LIFE -->
    <rect x="104" width="88" height="31" fill="#000000" stroke="#808080" stroke-width="2"/>
    <text x="148" y="13" text-anchor="middle" font-size="8" fill="#ffff00" font-weight="bold">FREE FOR</text>
    <text x="148" y="26" text-anchor="middle" font-size="11" fill="#00ffff" font-weight="bold">LIFE!</text>
    <!-- 3: Y2K READY -->
    <rect x="208" width="88" height="31" fill="#008000" stroke="#00ff00" stroke-width="2"/>
    <text x="252" y="13" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">✔ Y2K</text>
    <text x="252" y="26" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">COMPLIANT</text>
    <!-- 4: GET ME NOW -->
    <rect x="312" width="88" height="31" fill="#c0c0c0" stroke="#404040" stroke-width="2"/>
    <rect x="314" y="2" width="84" height="27" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="356" y="13" text-anchor="middle" font-size="9" fill="#000080" font-weight="bold">GET ME</text>
    <text x="356" y="26" text-anchor="middle" font-size="9" fill="#800000" font-weight="bold">NOW! ➜</text>
  </g>
</svg>
